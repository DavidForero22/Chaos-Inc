server {
    listen 80;
    server_name localhost;

    # Directorio de los archivos de React/Vue
    root /usr/share/nginx/html;
    index index.html;

    # Compresión GZIP (Tu versión optimizada)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Regla principal para la SPA
    location / {
        try_files $uri $uri/ /index.html;
        # Forzar a que el navegador SIEMPRE pida el index.html fresco al servidor
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Caché estricto para los recursos estáticos compilados por Vite
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}