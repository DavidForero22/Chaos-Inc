services:
  # FRONTEND (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.prod
    args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - chaos-inc-net

  # BACKEND (Laravel)
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      SERVER_NAME: ":8000"
    command: >
      sh -c "php artisan storage:link &&
             php artisan config:clear && 
             php artisan cache:clear && 
             php artisan migrate --force && 
             frankenphp run --config /etc/caddy/Caddyfile"
    depends_on:
      - mysql
      - redis
    networks:
      - chaos-inc-net

  # CONEXIÓN (Reverb)
  reverb:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - mysql
      - redis
    env_file:
      - ./backend/.env
    networks:
      - chaos-inc-net

  # TRABAJADOR DE COLAS
  worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90 --memory=128 --sleep=1
    depends_on:
      - mysql
      - redis
    env_file:
      - ./backend/.env
    networks:
      - chaos-inc-net
    deploy:
      replicas: 3

  # PLANIFICADOR DE TAREAS
  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    volumes:
      - ./backend:/var/www/html
    command: php artisan schedule:work
    depends_on:
      - mysql
      - redis
      - backend
    env_file:
      - ./backend/.env
    networks:
      - chaos-inc-net

  # BASE DE DATOS (MySQL)
  mysql:
    image: mysql:8.0
    container_name: chaosinc_db
    restart: always
    command: --log_bin_trust_function_creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - chaos-inc-net

  # CACHÉ/TIEMPO REAL (Redis)
  redis:
    image: valkey/valkey:8.0-alpine
    container_name: chaosinc_valkey
    restart: always
    command: >
      sh -c "valkey-server --requirepass ${REDIS_PASSWORD} & 
             sleep 2; 
             valkey-cli -a ${REDIS_PASSWORD} flushall; 
             wait"
    ports:
      - "6379:6379"
    networks:
      - chaos-inc-net

networks:
  chaos-inc-net:
    driver: bridge

volumes:
  db_data:
