# ============================================================
# Docker Compose para despliegue en Coolify
# ============================================================
# Diferencias con docker-compose-prod.yml:
#   - Sin env_file: todas las variables se gestionan desde
#     el panel de Coolify (Environment Variables)
#   - Sin port mappings al host: Coolify/Traefik enruta el
#     tráfico por dominio. Configura los dominios en UI:
#       frontend  → https://${DOMAIN}        (puerto interno 80)
#       backend   → https://api.${DOMAIN}    (puerto interno 8000)
#       reverb    → https://ws.${DOMAIN}     (puerto interno 8080)
#   - MySQL y Redis son servicios internos (sin puerto expuesto)
#   - worker/scheduler no necesitan dominio
# ============================================================

services:

  # ----------------------------------------------------------
  # FRONTEND (React + Vite)
  # Dominio en Coolify UI: https://${DOMAIN} → puerto 80
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_REVERB_HOST=${VITE_REVERB_HOST}
        - VITE_REVERB_PORT=${VITE_REVERB_PORT}
        - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - chaos-inc-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # BACKEND (Laravel + FrankenPHP)
  # Dominio en Coolify UI: https://api.${DOMAIN} → puerto 8000
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    expose:
      - "8000"
    command:
      - frankenphp
      - run
      - '--config'
      - /etc/caddy/Caddyfile
    environment:
      APP_NAME: 'Chaos Inc.'
      APP_ENV: production
      APP_KEY: '${APP_KEY}'
      APP_DEBUG: 'false'
      APP_URL: '${API_URL}'
      FRONTEND_URL: '${FRONTEND_URL}'
      APP_TIMEZONE: UTC
      APP_LOCALE: es
      FRANKENPHP_CONFIG: 'worker ./public/index.php'
      SERVER_NAME: ':8000'
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: '${MYSQL_DATABASE}'
      DB_USERNAME: '${MYSQL_USER}'
      DB_PASSWORD: '${MYSQL_PASSWORD}'
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      SESSION_DRIVER: cookie
      SESSION_LIFETIME: '120'
      SESSION_ENCRYPT: 'false'
      SESSION_PATH: /
      SESSION_EXPIRE_ON_CLOSE: 'true'
      SESSION_DOMAIN: '${DOMAIN}'
      SANCTUM_STATEFUL_DOMAINS: '${DOMAIN}'
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: redis
      CACHE_STORE: file
      FILESYSTEM_DISK: local
      REVERB_APP_ID: '${REVERB_APP_ID}'
      REVERB_APP_KEY: '${REVERB_APP_KEY}'
      REVERB_APP_SECRET: '${REVERB_APP_SECRET}'
      REVERB_HOST: reverb
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
      REVERB_WEBHOOK_URL: 'http://backend:8000/api/v1/webhooks/reverb'
      REVERB_APP_PING_INTERVAL: '10'
      REVERB_APP_ACTIVITY_TIMEOUT: '15'
      PUSHER_APP_ID: '${REVERB_APP_ID}'
      PUSHER_APP_KEY: '${REVERB_APP_KEY}'
      PUSHER_APP_SECRET: '${REVERB_APP_SECRET}'
      PUSHER_HOST: reverb
      PUSHER_PORT: '8080'
      PUSHER_SCHEME: http
      PUSHER_APP_CLUSTER: mt1
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      GOOGLE_REDIRECT_URI: '${API_URL}/auth/google/callback'
      DISCORD_CLIENT_ID: '${DISCORD_CLIENT_ID}'
      DISCORD_CLIENT_SECRET: '${DISCORD_CLIENT_SECRET}'
      DISCORD_REDIRECT_URI: '${API_URL}/auth/discord/callback'
      SUPER_ADMIN_USERNAME: '${SUPER_ADMIN_USERNAME}'
      SUPER_ADMIN_EMAIL: '${SUPER_ADMIN_EMAIL}'
      SUPER_ADMIN_PASSWORD: '${SUPER_ADMIN_PASSWORD}'
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-hello@example.com}'
      MAIL_FROM_NAME: 'Chaos Inc.'
      BCRYPT_ROUNDS: '12'
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - chaos-inc-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # REVERB (WebSockets)
  # Dominio en Coolify UI: https://ws.${DOMAIN} → puerto 8080
  # Asegúrate de activar "WebSocket support" en el proxy de Coolify
  # ----------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    expose:
      - "8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      SESSION_DOMAIN: ${DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
    networks:
      - chaos-inc-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # WORKER (colas Redis) — 3 réplicas como servicios separados
  # (deploy: replicas solo funciona en Swarm; esto es equivalente
  #  en Docker Compose normal y compatible con Coolify)
  # ----------------------------------------------------------
  x-worker-base: &worker-base
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    command: php artisan queue:work --tries=3 --timeout=90 --memory=128 --sleep=1
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      SESSION_DOMAIN: ${DOMAIN}
    networks:
      - chaos-inc-net
    restart: unless-stopped

  worker-1:
    <<: *worker-base

  worker-2:
    <<: *worker-base

  worker-3:
    <<: *worker-base
  # ----------------------------------------------------------
  # SCHEDULER (tareas programadas Laravel)
  # ----------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    command: php artisan schedule:work
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      SESSION_DOMAIN: ${DOMAIN}
    networks:
      - chaos-inc-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # MySQL — interno, sin puerto expuesto al host
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: chaosinc_db
    restart: always
    command: --log_bin_trust_function_creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - chaos-inc-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Redis/Valkey — interno, sin puerto expuesto al host
  # ----------------------------------------------------------
  redis:
    image: valkey/valkey:8.0-alpine
    container_name: chaosinc_valkey
    restart: always
    command: >
      sh -c "valkey-server --requirepass ${REDIS_PASSWORD} &
             sleep 2;
             valkey-cli -a ${REDIS_PASSWORD} flushall;
             wait"
    networks:
      - chaos-inc-net

networks:
  chaos-inc-net:
    driver: bridge

volumes:
  db_data: