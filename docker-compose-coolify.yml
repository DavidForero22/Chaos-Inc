# ============================================================
# Docker Compose para despliegue en Coolify
# ============================================================
# Diferencias con docker-compose-prod.yml:
#   - Sin env_file: todas las variables se gestionan desde
#     el panel de Coolify (Environment Variables)
#   - Sin port mappings al host: Coolify/Traefik enruta el
#     tráfico por dominio. Configura los dominios en UI:
#       frontend  → https://${DOMAIN}        (puerto interno 80)
#       backend   → https://api.${DOMAIN}    (puerto interno 8000)
#       reverb    → https://ws.${DOMAIN}     (puerto interno 8080)
#   - MySQL y Redis son servicios internos (sin puerto expuesto)
#   - worker/scheduler no necesitan dominio
# ============================================================

services:
  # ----------------------------------------------------------
  # FRONTEND (React + Vite)
  # Dominio en Coolify UI: https://${DOMAIN} → puerto 80
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile.prod
      args:
        - VITE_API_URL=${API_URL}
        - VITE_REVERB_APP_KEY=${REVERB_APP_KEY}
        - VITE_REVERB_HOST=${REVERB_PUBLIC_HOST} 
        - VITE_REVERB_PORT=${VITE_REVERB_PORT}  
        - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME} 
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # BACKEND (Laravel + FrankenPHP)
  # Dominio en Coolify UI: https://api.${DOMAIN} → puerto 8000
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    expose:
      - "80"
    command: frankenphp run --config /etc/caddy/Caddyfile
    environment:
      APP_NAME: "Chaos Inc."
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${API_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      APP_TIMEZONE: UTC
      APP_LOCALE: es
      FRANKENPHP_CONFIG: "worker ./public/index.php"
      SERVER_NAME: ":80"
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE}"
      DB_USERNAME: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: ${REVERB_PUBLIC_HOST}
      REVERB_PORT: ${VITE_REVERB_PORT}
      REVERB_SCHEME: ${VITE_REVERB_SCHEME}

      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      SESSION_DOMAIN: "${SESSION_DOMAIN}"
      SANCTUM_STATEFUL_DOMAINS: "${DOMAIN}"
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  # REVERB (WebSockets)
  # Dominio en Coolify UI: https://ws.${DOMAIN} → puerto 8080
  # Asegúrate de activar "WebSocket support" en el proxy de Coolify
  # ----------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    expose:
      - "8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: ${REVERB_PUBLIC_HOST}
      REVERB_PORT: ${VITE_REVERB_PORT}
      REVERB_SCHEME: ${VITE_REVERB_SCHEME}

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
    restart: unless-stopped

  # ----------------------------------------------------------
  # WORKER (colas Redis) — 3 réplicas como servicios separados
  # (deploy: replicas solo funciona en Swarm; esto es equivalente
  #  en Docker Compose normal y compatible con Coolify)
  # ----------------------------------------------------------
  x-worker-base: &worker-base
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    command: php artisan queue:work --tries=3 --timeout=90 --memory=128 --sleep=1
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      SESSION_DOMAIN: ${SESSION_DOMAIN}
    restart: unless-stopped

  worker-1:
    <<: *worker-base

  worker-2:
    <<: *worker-base

  worker-3:
    <<: *worker-base
  # ----------------------------------------------------------
  # SCHEDULER (tareas programadas Laravel)
  # ----------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    command: php artisan schedule:work
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${API_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      SESSION_DOMAIN: ${SESSION_DOMAIN}
    restart: unless-stopped

  # ----------------------------------------------------------
  # MySQL — interno, sin puerto expuesto al host
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: chaosinc_db
    restart: always
    command: --log_bin_trust_function_creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Redis/Valkey — interno, sin puerto expuesto al host
  # ----------------------------------------------------------
  redis:
    image: valkey/valkey:8.0-alpine
    container_name: chaosinc_valkey
    restart: always
    command: >
      sh -c "valkey-server --requirepass ${REDIS_PASSWORD} &
             sleep 2;
             valkey-cli -a ${REDIS_PASSWORD} flushall;
             wait"

volumes:
  db_data:
